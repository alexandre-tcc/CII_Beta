<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Run CII Report by Ticker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <style>
        .ticker-container {
            height: calc(100vh - 80px); /* full screen minus header */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }

        .form-card {
            background-color: #ffffff;
            padding: 60px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .form-card input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .form-card .card-btn {
            margin-top: 20px;
            background-color: #ffa41b;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .form-card .card-btn:hover {
            background-color: #cf8310;
        }

        .form-card a {
            color: #1e1f1e;
            text-decoration: underline;
        }

        .form-card a:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <header class="top-banner">
        <div class="logo-title">
            <img src="data:image/png;base64,{{ encoded_image }}" alt="Logo" class="logo" />
            <span class="platform-title">CII Platform</span>
        </div>
        <nav class="nav-links">
            <a href="/home">Home</a>
            <a href="/cii">CII</a>
            <a href="/impact_analysis">Impact Analysis</a>
        </nav>
    </header>

    <main class="ticker-container">
        <div class="form-card">
            <h1>Welcome to the 1TCC Impact Analysis Generator</h1>
            <p>Run analysis using a company ticker</p>
            <form method="POST">
                <input
                    type="text"
                    name="ticker"
                    placeholder="Ticker"
                    style="text-transform: uppercase;"
                    required>
                <br>
                <button type="submit" class="card-btn">Start</button>
            </form>
            <br>
            <p>Can't access ticker?
                <a href="https://1tcc.com/tcc-contact/" target="_blank">Check the database</a>
            </p>
        </div>
    </main>
</body>
</html>
